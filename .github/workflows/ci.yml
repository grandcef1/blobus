# ARCHITECT: CI гейтит тесты, типы и lint; сборку и деплой гейтит Vercel, поэтому здесь нет ни секретов,
# ни публикации артефактов. Сборка запускается как проверка того, что она проходит на чистом окружении.
name: CI

on:
    push:
        branches: [main]
    pull_request:

# ARCHITECT: новый прогон по той же ветке отменяет предыдущий: сигнал о последнем коммите важнее очереди
# из устаревших прогонов.
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  # Версия Node — из .nvmrc: та же, на которой проект собирается локально.
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run test
            - run: npm run build
            - run: npm run check:bundle
