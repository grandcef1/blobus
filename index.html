<!doctype html>
<html lang="ru" class="dark" data-theme="dark">
  <head>
    <!-- ARCHITECT: body скрыт до монтирования React — раскрытие по флагу data-app-ready из основного CSS;
         анимация-страховка раскрывает контент через 10с, если JS не загрузился, и работает без внешнего CSS. -->
    <style>
      html{background:#000;color-scheme:dark}body{margin:0;visibility:hidden;animation:app-reveal 0s linear 10s forwards}@keyframes app-reveal{to{visibility:visible}}
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/blobatar-icon.png" type="image/png" sizes="48x48" />
    <meta name="description" content="Blobus — персональный ИИ-репетитор английского: уроки, разговорная практика и подготовка к собеседованиям." />
    <title>Blobus — ИИ-репетитор</title>
  </head>
  <body>
    <noscript>
      Blobus — приложение с интерактивным интерфейсом: включите JavaScript в браузере и обновите
      страницу. Пока скрипты выключены, чат, уроки и личный кабинет не работают.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
